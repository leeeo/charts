server {
    listen 80;
    server_name charts.leeeo.app;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript text/plain image/svg+xml;
    server_tokens off;
    autoindex off;
    access_log off;
    error_log /dev/stderr warn;

    # no-transform: Cloudflare must not inject its analytics beacon (blocked by CSP) or rewrite mailto links.
    # style-src-attr: the chart renderer writes series colours and the donut centre size as style="" attributes
    # (validated #hex / var(--token) / colour keyword, escaped); <style> blocks and inline scripts stay blocked.
    add_header Cache-Control "no-cache, no-transform" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($http_x_forwarded_proto = "http") { return 308 https://charts.leeeo.app$request_uri; }

    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
