name: leeeo-charts-web
services:
  web:
    # Shared patched base (nginx 1.30 stable + apk upgrade), rebuilt 2026-11-11 (libxslt fix) from leeeo-company deploy/static/nginx-base.
    image: leeeo-nginx-base:20261111
    pull_policy: never
    container_name: leeeo-charts-web
    restart: unless-stopped
    # The VM's Docker address pools are exhausted; the default bridge needs no new network.
    network_mode: bridge
    ports:
      - "127.0.0.1:8818:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
